[project]
name = "ded-moroz"
version = "0.1.0"
description = "Ded Moroz advent gifts telegram bot"
authors = [{name = "Ded Moroz", email = "dedmoroz@example.com"}]
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4,<4.0",
    "SQLAlchemy[asyncio]>=2.0",
    "asyncpg>=0.28",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "APScheduler>=3.10",
    "httpx>=0.27",
    "pydantic>=2.4",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "uvloop>=0.19; platform_system != 'Windows'",
]

[project.optional-dependencies]
test = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "freezegun>=1.4",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-q"
