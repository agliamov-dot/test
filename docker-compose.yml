version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: dedmoroz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    command: ["python", "-m", "ded_moroz.bot"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  scheduler:
    build: .
    command: ["python", "-m", "ded_moroz.scheduler"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
